server {
    listen 80;

    # Without this, nginx's default redirect-scheme guessing stamps "http://"
    # onto the 301 below, since it only ever sees plain HTTP from the reverse
    # proxy — even when the original client request was HTTPS.
    absolute_redirect off;

    location /cloud/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /cloud/index.html;
    }

    location /cloud {
        return 301 /cloud/;
    }

    location /api/cloud/ {
        proxy_pass http://educloud-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 10G;
    }
}
